name: Deploy Game to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Sphere Velocity
        run: |
          cd rolling-ball
          npm ci || npm install
          npm run build
          cd ..

      - name: Build Skyway Stunt Driver
        run: |
          cd skyway-stunt-driver
          npm ci || npm install
          npm run build
          cd ..

      - name: Assemble Portfolio Site
        run: |
          mkdir -p public_site
          cp index.html public_site/index.html
          cp -r rolling-ball/dist public_site/rolling-ball
          cp -r skyway-stunt-driver/dist public_site/skyway-stunt

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
